name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build

      - name: Run API tests
        run: >
          dotnet test --no-build
          --filter "Category=Api"
          --logger "GitHubActions;summary-include-passed=true"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-results
          path: TestResults/
          retention-days: 14

  ui:
    name: UI tests (${{ matrix.browser }}, ${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            scope: full
            filter: Category=UI
          - browser: firefox
            scope: smoke
            filter: Category=UI&Category=Smoke
    env:
      TEST_Ui__Browser: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build

      - name: Install Playwright browser
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps ${{ matrix.browser }}

      - name: Run UI tests
        run: >
          dotnet test --no-build
          --filter "${{ matrix.filter }}"
          --logger "GitHubActions;summary-include-passed=true"

      - name: Upload results, traces and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-results-${{ matrix.browser }}
          path: TestResults/
          retention-days: 14

  docker:
    name: Docker image (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t pw-dotnet .

      - name: Run smoke tests in container
        run: docker run --rm pw-dotnet --filter "Category=Smoke"
